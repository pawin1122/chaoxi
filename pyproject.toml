[project]
name = "chaoxi"
version = "0.1.0"
description = "巨潮网数据获取CLI工具"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "pawin"}
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
chaoxi = "chaoxi.main:app"

[tool.uv]
package = true

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
