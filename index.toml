# chaoxi 项目文件索引 (TOML)

[project]
name = "chaoxi"
version = "0.1.0"
description = "巨潮网（cninfo.com.cn）公告数据获取 CLI 工具"
python = ">=3.12"

[directories]
production = "src/chaoxi"
docs = "doc"
tests = "tests"
dev = "inbox"

[directories.descriptions]
"doc/" = "用户文档"
"src/chaoxi/" = "生产源码"
"tests/" = "pytest 测试套件"
"inbox/" = "开发资料（设计文档、检修手册、参考项目）"

# ============================================================
# 根目录
# ============================================================

[root.files]
"pyproject.toml" = "项目构建配置（依赖、入口点、hatchling）"
"README.md" = "项目概览：快速开始、常用示例、参数速查"
".env.example" = "环境变量配置模板（复制为 .env 使用）"
".gitignore" = "Git 忽略规则"
"uv.lock" = "uv 依赖锁定文件（开发环境复现）"
"CHANGELOG.md" = "版本开发日志"
"index.toml" = "本文档 — 全部文件导航索引"

# ============================================================
# doc/ — 用户文档
# ============================================================

["doc/usage.md"]
category = "用户文档"
description = "完整使用手册：命令用法、输出结构、行为详解、错误处理、限制"

