"ref_CnInfoReports" = "单文件爬虫脚本"

# ============================================================
# 快速导航
# ============================================================

[navigation]
"了解项目用法" = "README.md → doc/usage.md"
"排查 bug、定位代码" = "inbox/development.md"
"理解架构设计" = "inbox/概要设计.md"
"查看字段/签名精确定义" = "inbox/detailed-design/0X_模块.md"
"查看编码过程记录" = "inbox/_任务流程/Agent-X_*.md"
"改命令行参数解析" = "cli/params.py"
"改 API 请求逻辑" = "query/fetcher.py"
"改 PDF 下载逻辑" = "downloader/downloader.py"
"改输出格式" = "output/formatter.py"
"改异常/错误提示" = "exceptions.py → 各模块投掷点"
"改配置项" = "utils/config.py"
