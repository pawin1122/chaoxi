# ============================================================
# tests/ — 测试
# ============================================================

[tests]

[tests."test_http_client.py"]
covers = "http_client.py"
description = "CninfoClient：重试、限流、Cookie 初始化"

[tests."test_logging.py"]
covers = "logging.py"
description = "LogEngine：写入/轮回/读取"

[tests."test_params.py"]
covers = "cli/params.py"
description = "参数解析：默认值/有效/无效/边界"

[tests."test_query.py"]
covers = "query/ (全部)"
description = "查询引擎全流程（mock HTTP）"

[tests."test_downloader.py"]
covers = "downloader/downloader.py"
description = "PdfDownloader：下载/校验/重试/断点续传"

[tests."test_formatter.py"]
covers = "output/formatter.py"
description = "OutputFormatter：三模式输出"

# ============================================================
# inbox/ — 开发资料
# ============================================================

[inbox]

[inbox.dev_tools]
"development.md" = "开发检修手册：环境、架构、调试、测试、排错、代码定位"

[inbox.design]
"需求分析.md" = "需求分析终稿"
"需求分析_草稿.md" = "需求初稿（已废弃）"
"概要设计.md" = "概要设计终稿"
