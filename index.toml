"03_PDF下载模块.md" = "PdfDownloader / DownloadTracker / 安全校验"
"04_输出模块.md" = "OutputFormatter / 三模式输出"
"05_管理模块.md" = "Cleaner / Debugger / LogViewer"
"06_CLI入口.md" = "Typer app / _main_async / 异常统一处理"
"07_配置与基础设施.md" = "AppSettings / CninfoClient / 异常体系 / LogEngine"
"08_包结构与文件清单.md" = "全部文件布局 / 编码顺序"

[inbox.task_logs]
"Agent-A_Tier1_基础设施.md" = "产出: config.py + exceptions.py + http_client.py + logging.py"
