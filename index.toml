"多子Agent并行编码方案.md" = "4 Tier / 7 Agent 调度方案"
"子Agent逻辑流程编排.md" = "每个 Agent 的专属任务描述"
"调度文档.md" = "进度跟踪总表"

[inbox.detailed_design]
"00_共享数据模型.md" = "QueryConfig / RawAnnouncement / Announcement / QueryMeta / AnnouncementList"
